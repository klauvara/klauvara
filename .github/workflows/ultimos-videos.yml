# Cada 6 horas mira el canal de YouTube y pone los 3 últimos vídeos en la web.
# También se puede lanzar a mano: pestaña Actions → "Últimos vídeos" → Run workflow.
name: Últimos vídeos

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python .github/scripts/ultimos_videos.py .
      - name: Guardar y publicar si ha cambiado algo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "klauvara"
          git config user.email "klauvara@users.noreply.github.com"
          git commit -m "Últimos vídeos de YouTube"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
